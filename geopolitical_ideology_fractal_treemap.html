<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>

const isDark=matchMedia('(prefers-color-scheme:dark)').matches;
const colors={
  fd:isDark?['#26215C','#3C3489','#534AB7','#7F77DD']:['#EEEDFE','#CECBF6','#AFA9EC','#7F77DD'],
  fld:isDark?['#04342C','#085041','#0F6E56','#1D9E75']:['#E1F5EE','#9FE1CB','#5DCAA5','#1D9E75'],
  hyb:isDark?['#412402','#633806','#854F0B','#BA7517']:['#FAEEDA','#FAC775','#EF9F27','#BA7517'],
  auth:isDark?['#501313','#791F1F','#A32D2D','#E24B4A']:['#FCEBEB','#F7C1C1','#F09595','#E24B4A']
};
const catLabels={fd:'Full democracy',fld:'Flawed democracy',hyb:'Hybrid regime',auth:'Authoritarian'};
const catTextColor={
  fd:isDark?'#CECBF6':'#3C3489',
  fld:isDark?'#9FE1CB':'#085041',
  hyb:isDark?'#FAC775':'#633806',
  auth:isDark?'#F7C1C1':'#791F1F'
};
const catStroke={
  fd:isDark?'rgba(175,169,236,0.3)':'rgba(83,74,183,0.25)',
  fld:isDark?'rgba(93,202,165,0.3)':'rgba(15,110,86,0.25)',
  hyb:isDark?'rgba(250,199,117,0.3)':'rgba(133,79,11,0.25)',
  auth:isDark?'rgba(240,149,149,0.3)':'rgba(163,45,45,0.25)'
};

const W=680,H=520;
const svg=d3.select('#map').append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%');
const tooltip=d3.select('#tooltip');

function getCat(d){
  let n=d;
  while(n.parent){if(n.data.cat)return n.data.cat;n=n.parent;}
  return 'fd';
}

function colorScale(cat,depth,i){
  const c=colors[cat];
  return c[Math.min(i%c.length,c.length-1)];
}

let currentRoot=null;

function render(root){
  currentRoot=root;
  const hierarchy=d3.hierarchy(root).sum(d=>d.v||0).sort((a,b)=>b.value-a.value);
  d3.treemap().size([W,H]).paddingOuter(3).paddingInner(2).round(true)(hierarchy);

  svg.selectAll('*').remove();
  const leaves=hierarchy.leaves();

  const groups=svg.selectAll('g').data(leaves).join('g');

  groups.append('rect')
    .attr('x',d=>d.x0).attr('y',d=>d.y0)
    .attr('width',d=>Math.max(0,d.x1-d.x0))
    .attr('height',d=>Math.max(0,d.y1-d.y0))
    .attr('rx',2)
    .attr('fill',(d,i)=>{const cat=getCat(d);const c=colors[cat];return c[i%c.length];})
    .attr('stroke',(d)=>catStroke[getCat(d)])
    .attr('stroke-width',0.5)
    .style('cursor','pointer')
    .on('mousemove',function(ev,d){
      const cat=getCat(d);
      const path=[];let n=d;while(n.parent){path.unshift(n.data.name);n=n.parent;}
      tooltip.style('display','block')
        .style('left',(ev.offsetX+12)+'px')
        .style('top',(ev.offsetY-10)+'px')
        .html(`<div style="font-weight:500;margin-bottom:2px;">${d.data.name}</div><div style="font-size:12px;color:var(--color-text-secondary);">${catLabels[cat]} — Pop: ${d.data.v>=1?Math.round(d.data.v)+'M':'<1M'}</div><div style="font-size:11px;color:var(--color-text-tertiary);margin-top:2px;">${path.slice(0,-1).join(' → ')}</div>`);
    })
    .on('mouseleave',()=>tooltip.style('display','none'));

  groups.each(function(d){
    const w=d.x1-d.x0, h=d.y1-d.y0;
    if(w>28&&h>14){
      const cat=getCat(d);
      const name=d.data.name;
      const maxChars=Math.floor(w/6.5);
      const label=name.length>maxChars?name.slice(0,maxChars-1)+'…':name;
      const fs=w<50||h<22?9:w<80?10:11;
      d3.select(this).append('text')
        .attr('x',d.x0+4).attr('y',d.y0+fs+3)
        .text(label)
        .attr('font-size',fs+'px')
        .attr('font-family','var(--font-sans)')
        .attr('fill',catTextColor[cat])
        .attr('pointer-events','none');
    }
  });

  const bc=d3.select('#breadcrumb');
  const backBtn=d3.select('#back');
  if(root===data){
    bc.text('All ideologies — sized by population');
    backBtn.style('display','none');
  } else {
    const trail=[];let r=root;trail.push(r.name);
    bc.text(trail.join(' → '));
    backBtn.style('display','inline-block');
  }
}

function buildLegend(){
  const leg=d3.select('#legend');
  Object.entries(catLabels).forEach(([k,label])=>{
    const c=isDark?colors[k][2]:colors[k][1];
    leg.append('span').style('display','flex').style('align-items','center').style('gap','4px')
      .html(`<span style="width:10px;height:10px;border-radius:2px;background:${c};"></span>${label}`);
  });
}

buildLegend();
render(data);

d3.select('#back').on('click',()=>render(data));

svg.on('dblclick',function(ev){
  const [mx,my]=[ev.offsetX*(W/svg.node().getBoundingClientRect().width),ev.offsetY*(H/svg.node().getBoundingClientRect().height)];
  if(currentRoot===data){
    const target=data.children.find(c=>{
      const h=d3.hierarchy(c).sum(d=>d.v||0);
      d3.treemap().size([W,H])(h);
      return true;
    });
    for(const child of data.children){
      const h=d3.hierarchy(child).sum(d=>d.v||0).sort((a,b)=>b.value-a.value);
      d3.treemap().size([W,H]).paddingOuter(3).paddingInner(2).round(true)(h);
      const hit=h.leaves().find(l=>mx>=l.x0&&mx<=l.x1&&my>=l.y0&&my<=l.y1);
      if(hit){render(child);break;}
    }
  }
});

svg.on('click',function(ev){
  if(currentRoot!==data)return;
  const rect=svg.node().getBoundingClientRect();
  const mx=ev.offsetX*(W/rect.width),my=ev.offsetY*(H/rect.height);
  const hierarchy=d3.hierarchy(data).sum(d=>d.v||0).sort((a,b)=>b.value-a.value);
  d3.treemap().size([W,H]).paddingOuter(3).paddingInner(2).round(true)(hierarchy);
  const hit=hierarchy.leaves().find(l=>mx>=l.x0&&mx<=l.x1&&my>=l.y0&&my<=l.y1);
  if(hit){
    let n=hit;
    while(n.parent&&n.parent.parent)n=n.parent;
    const catNode=data.children.find(c=>c.name===n.data.name);
    if(catNode)render(catNode);
  }
});
</script>

const catNames={fd:"Full democracy",fld:"Flawed democracy",hyb:"Hybrid regime",auth:"Authoritarian"};
const W=680,H=540;

function computeGlobal(list){
  let totalPop=0,totalBlue=0;
  list.forEach(c=>{totalPop+=c.pop;totalBlue+=c.pop*(c.blue/100);});
  return {totalPop,totalBlue,totalRed:totalPop-totalBlue,pctBlue:totalBlue/totalPop*100};
}

function updateStats(list){
  const g=computeGlobal(list);
  document.getElementById('s-blue').textContent=Math.round(g.pctBlue)+'%';
  document.getElementById('s-red').textContent=Math.round(100-g.pctBlue)+'%';
  const bar=document.getElementById('outcome-bar');
  const bPct=g.pctBlue;
  bar.innerHTML=`<div style="width:${bPct}%;background:#378ADD"></div><div style="width:${100-bPct}%;background:#E24B4A"></div><div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--color-text-primary);opacity:0.5"></div>`;
  const el=document.getElementById('s-outcome');
  if(bPct>=50){
    el.textContent='Everyone survives';
    el.style.color='#378ADD';
  } else {
    el.textContent='Red voters survive ('+Math.round(g.totalRed*1000000).toLocaleString()+')';
    el.style.color='#E24B4A';
  }
}

function renderTreemap(filter,sort){
  const list=filter==='all'?countries:countries.filter(c=>c.cat===filter);
  const sorted=[...list];
  if(sort==='blue')sorted.sort((a,b)=>b.blue-a.blue);
  else if(sort==='red')sorted.sort((a,b)=>a.blue-b.blue);
  else sorted.sort((a,b)=>b.pop-a.pop);

  updateStats(list);

  const root={name:"root",children:sorted.map(c=>({name:c.n,value:c.pop,blue:c.blue,cat:c.cat,reason:c.r}))};
  const hierarchy=d3.hierarchy(root).sum(d=>d.value||0);
  if(sort==='pop')hierarchy.sort((a,b)=>b.value-a.value);
  d3.treemap().size([W,H]).paddingOuter(2).paddingInner(1.5).round(true)(hierarchy);

  const wrap=document.getElementById('treemap-wrap');
  const existing=wrap.querySelector('svg');
  if(existing)existing.remove();

  const svg=d3.select('#treemap-wrap').append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%');
  const tt=d3.select('#tt');
  const leaves=hierarchy.leaves();

  const groups=svg.selectAll('g').data(leaves).join('g');

  groups.append('rect')
    .attr('x',d=>d.x0).attr('y',d=>d.y0)
    .attr('width',d=>Math.max(0,d.x1-d.x0))
    .attr('height',d=>Math.max(0,d.y1-d.y0))
    .attr('rx',2)
    .attr('fill',d=>{
      const b=d.data.blue/100;
      const r=Math.round(55+(1-b)*171);
      const g=Math.round(138*b+75*(1-b));
      const bl=Math.round(221*b+74*(1-b));
      return isDk?`rgb(${Math.round(r*0.55)},${Math.round(g*0.55)},${Math.round(bl*0.55)})`:`rgb(${r},${g},${bl})`;
    })
    .attr('stroke',isDk?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)')
    .attr('stroke-width',0.5)
    .style('cursor','pointer')
    .on('mousemove',function(ev,d){
      const rect=wrap.getBoundingClientRect();
      tt.style('display','block')
        .style('left',Math.min(ev.offsetX+12,W-200)+'px')
        .style('top',(ev.offsetY-10)+'px')
        .html(`<div style="font-weight:500;margin-bottom:3px">${d.data.name}</div>
<div style="display:flex;gap:12px;font-size:12px;margin-bottom:4px">
<span style="color:#378ADD">${d.data.blue}% blue</span>
<span style="color:#E24B4A">${100-d.data.blue}% red</span>
<span style="color:var(--color-text-tertiary)">${d.data.value>=1?Math.round(d.data.value)+'M':'<1M'} pop</span>
</div>
<div style="font-size:12px;color:var(--color-text-secondary);line-height:1.4">${d.data.reason}</div>
<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:3px">${catNames[d.data.cat]}</div>`);
    })
    .on('mouseleave',()=>tt.style('display','none'));

  groups.each(function(d){
    const w=d.x1-d.x0,h=d.y1-d.y0;
    if(w>24&&h>14){
      const maxC=Math.floor(w/5.8);
      const nm=d.data.name;
      const label=nm.length>maxC?nm.slice(0,maxC-1)+'…':nm;
      const fs=w<50||h<20?8:w<80?9:w<110?10:11;
      const bright=d.data.blue>55;
      d3.select(this).append('text')
        .attr('x',d.x0+3).attr('y',d.y0+fs+2)
        .text(label)
        .attr('font-size',fs+'px')
        .attr('font-family','var(--font-sans)')
        .attr('fill',isDk?(bright?'rgba(200,220,255,0.9)':'rgba(255,200,200,0.9)'):(bright?'#042C53':'#501313'))
        .attr('pointer-events','none');
      if(w>44&&h>28){
        d3.select(this).append('text')
          .attr('x',d.x0+3).attr('y',d.y0+fs+13)
          .text(d.data.blue+'%')
          .attr('font-size',(fs-1)+'px')
          .attr('font-family','var(--font-sans)')
          .attr('fill',isDk?'rgba(255,255,255,0.5)':'rgba(0,0,0,0.4)')
          .attr('pointer-events','none');
      }
    }
  });
}

renderTreemap('all','pop');
document.getElementById('filterCat').addEventListener('change',e=>renderTreemap(e.target.value,document.getElementById('sortBy').value));
document.getElementById('sortBy').addEventListener('change',e=>renderTreemap(document.getElementById('filterCat').value,e.target.value));
</script>
